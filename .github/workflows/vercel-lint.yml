name: Vercel - travel-drip: lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      statuses: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          for file in api/*.js scripts/*.js; do
            node --check "$file"
          done

      - name: Validate PWA configuration
        run: npm run validate:pwa

      - name: Verify links and routes
        run: npm run verify:qa

      - name: notify vercel
        if: always()
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: Vercel - travel-drip: lint
