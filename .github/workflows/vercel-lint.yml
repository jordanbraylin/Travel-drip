name: "Vercel - travel-drip: lint"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      statuses: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          for directory in api scripts; do
            if [ -d "$directory" ]; then
              find "$directory" -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
            fi
          done

      - name: Validate PWA configuration
        run: |
          if [ -f scripts/validate-pwa.js ]; then
            npm run validate:pwa
          else
            echo "scripts/validate-pwa.js not present; skipping PWA validation."
          fi

      - name: Verify links and routes
        run: |
          if [ -f scripts/verify-links-search-booking.js ]; then
            npm run verify:qa
          else
            echo "scripts/verify-links-search-booking.js not present; skipping local QA validation."
          fi

      - name: notify vercel
        if: always()
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - travel-drip: lint"
